name: NexFlow ERP CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install & Build Backend
      run: |
        cd backend
        npm ci
        npx prisma generate
        npm run build

    - name: Install & Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
